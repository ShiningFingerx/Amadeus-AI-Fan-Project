
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amadeus AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
      ::-webkit-scrollbar-thumb { background: #ff8c00; border-radius: 10px; }

      html, body, #root { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background-color: #000000; }
      body { font-family: 'Electrolize', sans-serif; }

      body::before {
        content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 1000; background-size: 100% 4px, 3px 100%; pointer-events: none;
      }

      /* --- GLITCH / BOZULMA EFEKTLERİ --- */
      @keyframes glitch-shake {
        0% { transform: translate(0); }
        20% { transform: translate(-5px, 5px); }
        40% { transform: translate(-5px, -5px); }
        60% { transform: translate(5px, 5px); }
        80% { transform: translate(5px, -5px); }
        100% { transform: translate(0); }
      }

      @keyframes glitch-color {
        0% { text-shadow: 2px 0 red, -2px 0 blue; }
        25% { text-shadow: -2px 0 red, 2px 0 blue; }
        50% { text-shadow: 2px 0 blue, -2px 0 green; }
        75% { text-shadow: -2px 0 green, 2px 0 red; }
        100% { text-shadow: 2px 0 red, -2px 0 blue; }
      }

      @keyframes glitch-flicker {
        0% { opacity: 1; }
        10% { opacity: 0.1; }
        20% { opacity: 1; }
        30% { opacity: 0.8; }
        40% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 1; }
      }

      .cognitive-glitch {
        animation: glitch-shake 0.1s infinite, glitch-flicker 0.2s infinite;
        filter: hue-rotate(90deg) contrast(150%) brightness(120%);
      }

      .cognitive-glitch * {
        animation: glitch-color 0.1s infinite !important;
      }

      /* --- SON EKRAN ANİMASYONLARI --- */
      @keyframes scroll-code { 
        0% { transform: translateY(-50%); } 
        100% { transform: translateY(0%); } 
      }

      .ending-red { background: #000000 !important; }
      .ending-blue { background: radial-gradient(circle at center, #001a1a 0%, #000 100%); }
      .ending-normal { background: radial-gradient(circle at center, #062a1e 0%, #000 100%); }

      .neural-node {
        position: absolute;
        width: 3px; height: 3px;
        background: #22d3ee;
        border-radius: 50%;
        box-shadow: 0 0 15px #22d3ee, 0 0 30px #0891b2;
        animation: float-neural 15s linear infinite;
      }

      .neural-path {
        position: absolute;
        width: 1px; height: 100vh;
        background: linear-gradient(to bottom, transparent, rgba(34, 211, 238, 0.2), transparent);
        animation: slide-path 20s linear infinite;
      }

      @keyframes float-neural {
        0% { transform: translateY(110vh) translateX(0); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateY(-10vh) translateX(20px); opacity: 0; }
      }

      @keyframes slide-path {
        from { transform: translateX(-100vw); }
        to { transform: translateX(100vw); }
      }

      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fade-in 1s ease-out forwards; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.1",
    "three": "https://esm.sh/three@^0.182.0",
    "three/": "https://esm.sh/three@^0.182.0/",
    "@pixiv/three-vrm": "https://esm.sh/@pixiv/three-vrm@^3.4.4"
  }
}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
